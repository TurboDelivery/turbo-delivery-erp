name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches: [ "Yamoussa" ]
    paths-ignore:
      - ".idea"
      - "**/*.md"
      - ".github/**"
      - "README.md"
      - "docs/**"

concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  notify_start:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord - Start
        env:
          # Variables passées au shell (pas interpolées dans le JSON inline),
          # ce qui permet à jq de gérer l'escape des sauts de ligne + caractères
          # spéciaux (parenthèses, accents, "). L'ancienne version cassait dès
          # qu'un commit message contenait des sauts de ligne ou des parenthèses.
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          PAYLOAD=$(jq -n \
            --arg actor "$ACTOR" \
            --arg branch "$REF_NAME" \
            --arg commit "$COMMIT_MSG" \
            --arg repo "$REPO" \
            --arg run_id "$RUN_ID" \
            '{
              username: "CI/CD Bot",
              embeds: [{
                title: "🚀 Workflow Started",
                description: ("👤 Pushed by: " + $actor + "\n" +
                              "🌿 Branch: " + $branch + "\n" +
                              "📝 Commit: " + $commit + "\n" +
                              "🔗 Repo: https://github.com/" + $repo + "\n" +
                              "⚙️ Job: https://github.com/" + $repo + "/actions/runs/" + $run_id),
                color: 16776960
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK"
  


  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit --pretty

  build:
    needs: typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        run: echo "VERSION=ci-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Routing post-fusion :
          # - erp-backend (port 8008) tourne ENCORE et gère l'auth ERP (login,
          #   /api/V1/turbo/erp/user/login). On garde donc ERP_URL sur erp-prod.
          # - restaurant-backend et client-backend ont été arrêtés ; leurs hosts
          #   resto-prod et customer-prod retournent 502. On les route sur
          #   backend-prod (main-backend) qui a fusionné leurs endpoints.
          # - delivery-backend pareil — DNS ne résout plus → on route en
          #   préventif sur backend-prod.
          # - BACKEND_URL = main-backend (fusion V1+V2), c'est l'endpoint de
          #   référence pour les nouveaux services (finance, tickets, etc.).
          build-args: |
            VERSION=${{ env.VERSION }}
            NEXT_PUBLIC_BACKEND_PROTOCOL=https
            NEXT_PUBLIC_API_ERP_URL=https://erp-prod.turbodeliveryapp.com
            NEXT_PUBLIC_API_RESTO_URL=https://backend-prod.turbodeliveryapp.com
            NEXT_PUBLIC_API_CLIENT_URL=https://backend-prod.turbodeliveryapp.com
            NEXT_PUBLIC_API_DELIVERY_URL=https://backend-prod.turbodeliveryapp.com
            NEXT_PUBLIC_API_BACKEND_URL=https://backend-prod.turbodeliveryapp.com
            NEXT_PUBLIC_API_SOCKET_URL=https://socket-prod.turbodeliveryapp.com
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF
          
            IMAGE="$IMAGE_NAME:latest"
          
            echo "Pull latest image..."
            docker pull \$IMAGE
          
            echo "Stopping old container..."
            docker stop turbo-erp-front || true
            docker rm turbo-erp-front || true
          
            echo "Starting new container..."
            docker run -d \
              --name turbo-erp-front \
              --restart unless-stopped \
              --memory "300m" \
              --cpus="1.0" \
              --env-file /var/www/turbo/prod/turbo-delivery-erp/.env \
              -p 4002:3000 \
              \$IMAGE
          
            echo "Cleaning unused images..."
            docker image prune -f
          
            echo "Deployment done."
          
          EOF
  notify_end:
    needs: [ build, deploy ]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Set status
        run: |
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "COLOR=15548997" >> $GITHUB_ENV
            echo "TITLE=❌ Workflow Failed" >> $GITHUB_ENV
          else
            echo "COLOR=5763719" >> $GITHUB_ENV
            echo "TITLE=✅ Workflow Successful" >> $GITHUB_ENV
          fi

      - name: Notify Discord - Result
        env:
          # Cf. notify_start — jq évite les soucis d'escape des commit messages
          # multi-lignes ou avec caractères spéciaux.
          TITLE: ${{ env.TITLE }}
          COLOR: ${{ env.COLOR }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg actor "$ACTOR" \
            --arg branch "$REF_NAME" \
            --arg commit "$COMMIT_MSG" \
            --arg repo "$REPO" \
            --arg run_id "$RUN_ID" \
            '{
              username: "CI/CD Bot",
              embeds: [{
                title: $title,
                description: ("👤 Pushed by: " + $actor + "\n" +
                              "🌿 Branch: " + $branch + "\n" +
                              "📝 Commit: " + $commit + "\n" +
                              "🔗 Repo: https://github.com/" + $repo + "\n" +
                              "⚙️ Job: https://github.com/" + $repo + "/actions/runs/" + $run_id),
                color: $color
              }]
            }')
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK"