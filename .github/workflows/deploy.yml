name: CD to Production

on:
  push:
    branches:
      - Yamoussa   # ou main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/turbo/prod/turbo-delivery-erp
            git reset --hard
            git pull origin Yamoussa
            pnpm install
            pnpm build
            pm2 restart 2
